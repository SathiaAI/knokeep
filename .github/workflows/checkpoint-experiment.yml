name: Checkpoint experiment
on:
  pull_request:
    paths: ['experiments/checkpoint_v1/**', 'store/**', '.github/workflows/checkpoint-experiment.yml']
  push:
    branches: ['**']
    paths: ['experiments/checkpoint_v1/**', 'store/**', '.github/workflows/checkpoint-experiment.yml']
permissions:
  contents: read
jobs:
  checkpoint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - name: Experimental checkpoint crash and transition checks
        run: python -m pytest experiments/checkpoint_v1/tests -q
