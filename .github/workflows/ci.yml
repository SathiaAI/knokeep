name: CI

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

# V2 pluggable-storage code PLUS the V2.1 unify: the skill now rides the store
# engine (store/gate + LocalBackend) and the plugin wires an MCP server, so the
# skill / shared-store / plugin-root tests are part of the gate now.
env:
  V2_TESTS: >-
    conformance
    tests/test_boundary.py
    tests/test_gate_hardening.py
    tests/test_gate_supplement.py
    tests/test_plugin_store_root.py
    tests/test_local_backend.py
    tests/test_git_backend.py
    tests/test_objectstore.py
    tests/test_postgres.py
    tests/test_mcp.py
    tests/test_migration.py
    tests/test_reconciler_divergence.py
    tests/test_reconciler_no_write_path.py
    tests/test_reconciler_secret_quarantine.py
  # V1/skill acceptance tests are script-style (run directly, not pytest-collected).
  SKILL_TESTS: >-
    tests/test_v1.py
    tests/test_concurrency.py
    tests/test_eval.py
    tests/test_audit.py
    tests/test_skill_mcp_shared_store.py

jobs:
  test-linux:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: knokeep
          POSTGRES_DB: knokeep_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U knokeep -d knokeep_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest pg8000 boto3 "moto[server]" flask flask-cors
      - name: V2 conformance + tests (all four backends) + unified skill/plugin tests
        run: python -m pytest $V2_TESTS -q
      - name: V1/skill acceptance scripts (unified engine)
        run: |
          set -e
          for t in $SKILL_TESTS; do echo "== $t =="; python "$t"; done

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest pg8000 boto3 "moto[server]" flask flask-cors
      - name: Local adapter (msvcrt/NTFS native) + conformance + skill/plugin tests
        shell: bash
        run: python -m pytest tests/test_local_backend.py conformance tests/test_gate_supplement.py tests/test_plugin_store_root.py -q
      - name: V1/skill acceptance scripts (unified engine)
        shell: bash
        run: |
          set -e
          for t in $SKILL_TESTS; do echo "== $t =="; python "$t"; done
      - name: Plugin manifests + cross-OS MCP launcher smoke (node -> python -m mcp.server)
        shell: bash
        run: |
          set -e
          python -c "import json;json.load(open('.claude-plugin/plugin.json'));json.load(open('.claude-plugin/marketplace.json'));print('manifests valid JSON')"
          node --check shims/launch_mcp.mjs
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | KNOKEEP_STORE="$RUNNER_TEMP/kk-store" node shims/launch_mcp.mjs > launcher_out.txt
          grep -q '"name": "knokeep-mcp"' launcher_out.txt
          grep -q 'knokeep_read' launcher_out.txt
          echo "launcher handshake + tools/list OK"

  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pytest pg8000 boto3 "moto[server]" flask flask-cors
      - name: Core adapter + conformance + skill/plugin tests
        run: python -m pytest tests/test_local_backend.py conformance tests/test_gate_supplement.py tests/test_plugin_store_root.py -q
      - name: V1/skill acceptance scripts (unified engine)
        run: |
          set -e
          for t in $SKILL_TESTS; do echo "== $t =="; python "$t"; done
      - name: Plugin manifests + cross-OS MCP launcher smoke (node -> python -m mcp.server)
        run: |
          set -e
          python -c "import json;json.load(open('.claude-plugin/plugin.json'));json.load(open('.claude-plugin/marketplace.json'));print('manifests valid JSON')"
          node --check shims/launch_mcp.mjs
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
            | KNOKEEP_STORE="$RUNNER_TEMP/kk-store" node shims/launch_mcp.mjs > launcher_out.txt
          grep -q '"name": "knokeep-mcp"' launcher_out.txt
          grep -q 'knokeep_read' launcher_out.txt
          echo "launcher handshake + tools/list OK"

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | tar xz gitleaks
      - name: Scan V2 product source (must be clean; V1 legacy + test fixtures out of scope)
        run: |
          set -e
          for d in store reconciler mcp migrate; do
            echo "== gitleaks: $d =="
            ./gitleaks detect --no-git --source "$d" --no-banner --redact
          done
